<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ABSU Command Center</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Auth Shield -->
    <script src="auth.js"></script>
    <script>
        // Secure Route Protection
        if (!AuthSystem.isAuthenticated() || AuthSystem.getUser().role !== 'admin') {
            window.location.replace('portal.html?redirect=admin.html');
        }
    </script>
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; min-height: 100vh; background: #050505; }
        .sidebar {
            width: 280px; height: 100vh; position: fixed; left: 0; top: 0;
            background: rgba(255, 255, 255, 0.03); border-right: 1px solid var(--glass-border);
            backdrop-filter: blur(20px); display: flex; flex-direction: column; padding: 2.5rem; z-index: 1000;
        }
        .sidebar-logo { font-size: 2rem; font-weight: 800; color: var(--accent); margin-bottom: 4rem; text-align: center; }
        .sidebar-links { list-style: none; display: flex; flex-direction: column; gap: 1rem; }
        .sidebar-links a {
            text-decoration: none; color: rgba(255, 255, 255, 0.6); display: flex;
            align-items: center; gap: 1rem; padding: 1rem 1.5rem; border-radius: 12px; transition: 0.3s; cursor: pointer;
        }
        .sidebar-links a:hover, .sidebar-links a.active { background: rgba(255, 215, 0, 0.1); color: var(--accent); }
        .main-content { flex: 1; margin-left: 280px; padding: 3rem 5%; transition: 0.3s; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4rem; flex-wrap: wrap; gap: 2rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2rem; margin-bottom: 4rem; }
        .stat-card { padding: 2.5rem; text-align: left; }
        .stat-card i { font-size: 2rem; color: var(--accent); margin-bottom: 1rem; }
        .stat-value { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        .content-box { padding: 3rem; border-radius: 20px; overflow-x: auto; }
        .content-box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .search-input { width: 100%; padding: 0.8rem 1rem 0.8rem 2.5rem; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 10px; color: white; position: relative; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { text-align: left; padding: 1rem; color: var(--accent); border-bottom: 1px solid var(--glass-border); }
        td { padding: 1.2rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .status-pill { padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.85rem; background: rgba(52, 211, 153, 0.1); color: #10b981; }
        .toast { position: fixed; bottom: 30px; right: -330px; background: var(--accent); color: var(--primary); padding: 1rem 2rem; border-radius: 12px; z-index: 2000; transition: 0.5s; }
        .toast.show { right: 30px; }
        .sidebar-exit-link { margin-top: auto; color: rgba(255, 255, 255, 0.4); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; padding: 1rem; }
        @media (max-width: 992px) { .sidebar { width: 80px; padding: 2rem 1rem; } .sidebar-links span, .sidebar-logo, .sidebar-exit-link span { display: none; } .main-content { margin-left: 80px; } }
    </style>
</head>
<body id="top">
    <!-- Site Preloader -->
    <div id="site-preloader">
        <div class="preloader-logo">ABSU</div>
        <div class="preloader-content"><div class="preloader-bar"></div></div>
        <div class="preloader-tagline">Excellence in Service</div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">ABSU</div>
        <ul class="sidebar-links">
            <li><a class="nav-admin active" onclick="switchSection('dashboard')"><i class="fas fa-th-large"></i> <span>Overview</span></a></li>
            <li><a class="nav-admin" onclick="switchSection('students')"><i class="fas fa-users"></i> <span>Students</span></a></li>
            <li><a class="nav-admin" onclick="switchSection('blog')"><i class="fas fa-newspaper"></i> <span>Blog Posts</span></a></li>
            <li><a href="index.html"><i class="fas fa-home"></i> <span>Home</span></a></li>
        </ul>
        <a href="#" onclick="AuthSystem.logout()" class="sidebar-exit-link">
            <i class="fas fa-sign-out-alt"></i> <span>Secure Logout</span>
        </a>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="adminMain">
        <div class="dashboard-header">
            <div class="header-title">
                <h1 id="section-title">Admin Overview</h1>
                <p>Institutional Command Center</p>
            </div>
        </div>

        <div id="dashboard" class="admin-section">
            <div class="stats-grid">
                <div class="stat-card glass-effect"><i class="fas fa-user-graduate"></i><div class="stat-value" id="statStudents">0</div><div class="stat-label">Total Students</div></div>
                <div class="stat-card glass-effect"><i class="fas fa-file-alt"></i><div class="stat-value" id="statPosts">0</div><div class="stat-label">Blog Posts</div></div>
                <div class="stat-card glass-effect"><i class="fas fa-university"></i><div class="stat-value" id="statFaculties">10</div><div class="stat-label">Active Faculties</div></div>
                <div class="stat-card glass-effect"><i class="fas fa-chart-line"></i><div class="stat-value" id="statHealth">98.5%</div><div class="stat-label">System Health</div></div>
            </div>

            <div class="content-box glass-effect">
                <div class="content-box-header"><h2>Enrolled Academic Identities</h2></div>
                <table>
                    <thead><tr><th>Name</th><th>Email</th><th>Faculty</th><th>Department</th><th>Status</th></tr></thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="adminToast" class="toast">Action completed!</div>

    <script src="main.js"></script>
    <script>
        // Administrative Orchestrator
        document.addEventListener('DOMContentLoaded', async () => {
            await Promise.all([loadStats(), loadStudents()]);
            switchSection('dashboard');
        });

        async function loadStats() {
            try {
                const res = await fetch('/api/auth/admin/stats');
                const data = await res.json();
                document.getElementById('statStudents').innerText = data.students;
                document.getElementById('statPosts').innerText = data.posts;
                document.getElementById('statFaculties').innerText = data.faculties;
                document.getElementById('statHealth').innerText = data.health;
            } catch(e) { console.error('Stat Retrieval Failure'); }
        }

        async function loadStudents() {
            try {
                const res = await fetch('/api/auth/admin/students');
                const students = await res.json();
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';
                students.forEach(s => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${s.name}</td>
                        <td>${s.email}</td>
                        <td>${s.faculty || 'Unassigned'}</td>
                        <td>${s.department || 'Unassigned'}</td>
                        <td><span class="status-pill">Active</span></td>
                    `;
                    tbody.appendChild(row);
                });
            } catch(e) { console.error('Identity Retrieval Failure'); }
        }

        function switchSection(id) {
            document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none');
            const target = document.getElementById(id);
            if (target) target.style.display = 'block';
            document.getElementById('section-title').innerText = id.charAt(0).toUpperCase() + id.slice(1) + ' Hub';
        }
    </script>
</body>
</html>
